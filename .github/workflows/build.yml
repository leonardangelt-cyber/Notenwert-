name: APK bauen

on:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Quelle finden (neueste ZIP entpacken)
        id: src
        run: |
          set -e
          ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$ZIP" ]; then
            echo "Entpacke $ZIP"
            rm -rf work && mkdir work
            unzip -q "$ZIP" -d work
            SETTINGS=$(find work -maxdepth 3 \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          else
            echo "Keine ZIP gefunden, suche Projekt direkt im Repo"
            SETTINGS=$(find . -maxdepth 2 -not -path './work/*' \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          fi
          if [ -z "$SETTINGS" ]; then
            echo "::error::Keine settings.gradle(.kts) gefunden. Liegt die ZIP im Hauptordner des Repos?"
            ls -R | head -n 50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Projektordner: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Pakete
        run: |
          SDKMANAGER=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | $SDKMANAGER --licenses > /dev/null || true
          $SDKMANAGER "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK bauen
        working-directory: ${{ steps.src.outputs.dir }}
        run: |
          set -o pipefail
          gradle assembleRelease --console=plain 2>&1 | tee "${{ github.workspace }}/build.log"

      - name: Fehler anzeigen
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A6 build.log | head -n 60

      - name: APK einsammeln
        run: |
          APK=$(find "${{ steps.src.outputs.dir }}" -path '*outputs/apk/release/*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "::error::Keine APK gefunden"; exit 1; fi
          mkdir -p out && cp "$APK" out/Notenwerk.apk
          ls -la out

      - name: Als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Notenwerk-APK
          path: out/Notenwerk.apk
          if-no-files-found: error

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/Notenwerk.apk \
            --title "Notenwerk Build ${{ github.run_number }}" \
            --notes "Automatisch gebaut aus der neuesten ZIP."
